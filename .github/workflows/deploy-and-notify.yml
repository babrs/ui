name: Deploy and notify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp -r dist/. _site/
          cp -r static/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.ORG_ADMIN_TOKEN }}

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch ui-updated to Babrs/games
        env:
          ORG_ADMIN_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          curl -fsS -X POST https://api.github.com/repos/Babrs/games/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $ORG_ADMIN_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"event_type":"ui-updated"}'
